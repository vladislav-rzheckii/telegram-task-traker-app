<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Наши дела</title>
<meta name="theme-color" content="#2481cc">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Макет: узкая колонка как в Telegram Mini App. Сверху четыре вкладки и фильтры, внизу плавающая кнопка «Добавить». Подробности задачи раскрываются прямо в строке. */
:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --fg: #16212b;
  --muted: #6a7885;
  --line: #e1e7ed;
  --accent: #2481cc;
  --accent-fg: #ffffff;
  --accent-soft: #e1eefa;
  --him: #2f7fd1;
  --him-soft: #e3effb;
  --her: #d4507a;
  --her-soft: #fbe6ee;
  --both: #2f9a6e;
  --both-soft: #dff3ea;
  --p1: #3a8fd9;
  --p2: #d98a14;
  --p3: #d1432f;
  --danger: #c4402f;
  --toast-link: #86c4f7;
  --shadow: 0 6px 20px rgba(22, 33, 43, .14);
  --nav-h: 62px;
  --done: #2f9a6e;
  --on-bright: #ffffff;
  --r: 14px;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Unbounded", "Onest", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg: #0a0a0b;
  --surface: #151517;
  --fg: #f4f4f5;
  --muted: #8b8b95;
  --line: #26262b;
  --accent: #c8f542;
  --accent-fg: #0a0a0b;
  --accent-soft: #1b2210;
  --him: #5ab8ff;
  --him-soft: #10202e;
  --her: #ff72a2;
  --her-soft: #2e1520;
  --both: #ffb84a;
  --both-soft: #2c2110;
  --done: #c8f542;
  --on-bright: #0a0a0b;
  --p1: #5ab8ff;
  --p2: #ffb84a;
  --p3: #ff5d4d;
  --danger: #ff6a5a;
  --toast-link: #4d6a00;
  --shadow: 0 10px 28px rgba(0, 0, 0, .65);
  --r: 20px;
  color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0b;
  --surface: #151517;
  --fg: #f4f4f5;
  --muted: #8b8b95;
  --line: #26262b;
  --accent: #c8f542;
  --accent-fg: #0a0a0b;
  --accent-soft: #1b2210;
  --him: #5ab8ff;
  --him-soft: #10202e;
  --her: #ff72a2;
  --her-soft: #2e1520;
  --both: #ffb84a;
  --both-soft: #2c2110;
  --done: #c8f542;
  --on-bright: #0a0a0b;
  --p1: #5ab8ff;
  --p2: #ffb84a;
  --p3: #ff5d4d;
  --danger: #ff6a5a;
  --toast-link: #4d6a00;
  --shadow: 0 10px 28px rgba(0, 0, 0, .65);
  --r: 20px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 16px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible, .day:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.ic { width: 13px; height: 13px; flex: none; }

.app { max-width: 480px; margin: 0 auto; min-width: 0; padding-bottom: calc(var(--nav-h) + 8px); }

/* Шапка */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  padding-block: 14px 10px;
  display: grid;
  gap: 12px;
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: -.01em; margin: 0; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.theme { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--fg); }
.theme svg { width: 17px; height: 17px; }
.viewer {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px 5px 6px; font-size: 13px;
}
.viewer .av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--on-bright); }
.av.him { background: var(--him); }
.av.her { background: var(--her); }

/* Нижняя навигация */
.bnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 12;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
}
.bnav-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: var(--nav-h); }
.tab {
  border: 0; background: transparent; padding: 0; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 11.5px; font-weight: 500;
}
.tab .pillic { position: relative; width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .15s; }
.nbadge { position: absolute; top: -3px; right: 2px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-fg); font-size: 10.5px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.tab .ni { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab[aria-selected="true"] .pillic { background: var(--accent-soft); }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 14px; font-size: 13.5px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }
.chip.list-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.him { background: var(--him); }
.dot.her { background: var(--her); }
.dot.both { background: var(--both); }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

/* Сводка дня */
.summary {
  display: flex; align-items: center; gap: 14px; margin-block: 10px 2px; padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
}
.ring { position: relative; width: 56px; height: 56px; flex: none; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .rt { stroke: var(--line); }
.ring .rf { stroke: var(--done); stroke-linecap: round; transition: stroke-dasharray .3s; }
.ring b { position: relative; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sum-t { display: grid; gap: 2px; min-width: 0; }
.sum-t b { font-size: 16px; font-weight: 600; }
.sum-t span { color: var(--muted); font-size: 13.5px; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--both); border-radius: 3px; transition: width .25s; }

/* Группы и строки */
.group { margin-top: 18px; }
.group h2 {
  margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted);
  display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
}
.group h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
.group.late h2 { color: var(--danger); }
.group.now h2 { color: var(--accent); }
.list { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.task + .task { border-top: 1px solid var(--line); }
.task-main { display: flex; align-items: flex-start; gap: 12px; padding: 12px 12px 12px 14px; min-width: 0; }
.task.open { background: color-mix(in srgb, var(--accent) 4%, var(--surface)); }
.check {
  flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%;
  border: 2px solid var(--muted); background: transparent; display: grid; place-items: center; padding: 0; color: var(--on-bright);
}
.check.p1 { border-color: var(--p1); }
.check.p2 { border-color: var(--p2); }
.check.p3 { border-color: var(--p3); background: color-mix(in srgb, var(--p3) 12%, transparent); }
.check svg { width: 14px; height: 14px; opacity: 0; }
.task.done .check { background: var(--done); border-color: var(--done); }
.task.done .check svg { opacity: 1; }
.check:disabled { opacity: .35; }
.body { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; display: block; }
.title { display: block; overflow-wrap: anywhere; }
.task.done .title { text-decoration: line-through; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 12.5px; color: var(--muted); align-items: center; }
.meta > span { display: inline-flex; align-items: center; gap: 4px; }
.who { border-radius: 999px; padding: 1px 9px 1px 7px; font-weight: 500; gap: 5px !important; }
.who.him { background: var(--him-soft); color: var(--him); }
.who.her { background: var(--her-soft); color: var(--her); }
.who.both { background: var(--both-soft); color: var(--both); }
.pr.p1 { color: var(--p1); }
.pr.p2 { color: var(--p2); }
.pr.p3 { color: var(--p3); }
.late-date { color: var(--danger); }

/* Раскрытая задача */
.detail { padding: 0 14px 14px 50px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.actbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.actbar .pill svg { width: 16px; height: 16px; }
.pill[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.ibtns { display: flex; gap: 6px; }
.ibtn { width: 40px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; color: var(--muted); padding: 0; }
.ibtn svg { width: 18px; height: 18px; }
.ibtn.danger { color: var(--danger); }
.ibtn.on { color: var(--her); border-color: var(--her); background: var(--her-soft); }
.ibtn.on svg { fill: currentColor; }
.dsec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.dsec-h { display: flex; justify-content: space-between; align-items: baseline; }
.cap { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cnt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ghosts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.ghosts.one-col { grid-template-columns: minmax(0, 1fr); }
.ghost { border: 1px dashed var(--muted); background: transparent; border-radius: 12px; padding: 10px 6px; color: var(--muted); display: flex; gap: 6px; align-items: center; justify-content: center; font-size: 13.5px; min-width: 0; }
.ghost svg { width: 15px; height: 15px; }
.sub-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.sub { display: flex; align-items: center; gap: 10px; min-height: 30px; }
.subcheck { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.8px solid var(--muted); background: transparent; padding: 0; display: grid; place-items: center; color: var(--on-bright); }
.subcheck svg { width: 11px; height: 11px; opacity: 0; }
.sub.done .subcheck { background: var(--done); border-color: var(--done); }
.sub.done .subcheck svg { opacity: 1; }
.sub.done .st { color: var(--muted); text-decoration: line-through; }
.st { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.x { flex: none; border: 0; background: none; color: var(--muted); padding: 4px; border-radius: 6px; line-height: 0; }
.x svg { width: 12px; height: 12px; }
.addrow { display: flex; gap: 8px; }
.mini {
  flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
}
.go { flex: none; border: 0; background: var(--accent); color: var(--accent-fg); border-radius: 10px; padding: 0 14px; font-weight: 600; }
.row-l { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.pill {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px;
  font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
}
.pill svg { width: 14px; height: 14px; }
.pill.on { border-color: var(--her); color: var(--her); background: var(--her-soft); }
.pill.danger { color: var(--danger); }
.comments { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; font-size: 13.5px; }
.cm { overflow-wrap: anywhere; }
.cm b { font-weight: 600; margin-right: 6px; }
.cm b.him { color: var(--him); }
.cm b.her { color: var(--her); }

.empty { text-align: center; color: var(--muted); padding: 36px 12px; }
.empty b { display: block; color: var(--fg); margin-bottom: 4px; font-weight: 600; }

/* Календарь */
.mode { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; background: var(--line); border-radius: 10px; padding: 3px; margin-top: 12px; }
.mode button { border: 0; background: transparent; border-radius: 8px; padding: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.mode button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-top: 10px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
.cal-head .month { font-family: var(--font-display); font-weight: 500; font-size: 15px; text-transform: capitalize; text-align: center; }
.cal-head .month span { color: var(--muted); margin-left: 6px; font-family: var(--font-body); font-weight: 400; }
.nav { border: 0; background: var(--bg); width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; padding: 0; flex: none; }
.nav svg { width: 16px; height: 16px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.wd { text-align: center; font-size: 11.5px; color: var(--muted); padding: 4px 0; }
.wd.we { color: var(--danger); }
.day {
  border: 0; background: transparent; border-radius: 10px; aspect-ratio: 1 / 1.05;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0;
  font-variant-numeric: tabular-nums;
}
.day.out { color: var(--muted); opacity: .5; }
.day.today .num { background: var(--accent); color: var(--accent-fg); }
.day .num { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-size: 14px; }
.day.sel { background: var(--bg); box-shadow: inset 0 0 0 2px var(--accent); }
.dots { display: flex; gap: 3px; height: 6px; }
.dots .dot { width: 6px; height: 6px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.free { color: var(--muted); font-size: 13.5px; padding: 2px 2px 0; }

/* Списки и привычки */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-top: 14px; }
.lcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; background: none; border: 0; }
.lcard + .lcard { border-top: 1px solid var(--line); }
.lcard .sw { width: 14px; height: 14px; border-radius: 4px; }
.lcard .nm { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
.lcard .ct { color: var(--muted); font-size: 13px; }
.lcard svg { width: 14px; height: 14px; color: var(--muted); }
.form-card { padding: 14px; display: grid; gap: 10px; }
.form-card h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swb { width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent; padding: 0; }
.swb[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--fg); }
.habit { padding: 14px; display: grid; gap: 10px; }
.habit + .habit { border-top: 1px solid var(--line); }
.habit h3 { margin: 0; font-size: 15px; font-weight: 600; }
.hrow { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px; align-items: center; }
.hl { font-size: 13px; min-width: 0; }
.hl b { display: flex; align-items: center; gap: 6px; font-weight: 500; }
.hl small { color: var(--muted); font-size: 11.5px; }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.hd {
  width: 100%; max-width: 34px; justify-self: center; aspect-ratio: 1; border-radius: 50%;
  border: 1.5px solid var(--line); background: transparent; display: grid; place-items: center;
  font-size: 10.5px; color: var(--muted); padding: 0; text-transform: capitalize;
}
.hd.on { background: var(--c); border-color: var(--c); color: var(--on-bright); }
.hd.today { box-shadow: 0 0 0 2px var(--accent-soft); }
.hd.ro { opacity: .75; }

/* Кнопка добавления */
.dock { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px); display: flex; justify-content: flex-end; margin-top: 20px; pointer-events: none; }
.add {
  pointer-events: auto; border: 0; background: var(--accent); color: var(--accent-fg);
  border-radius: 999px; padding: 14px 22px 14px 18px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow);
}
.add svg { width: 18px; height: 18px; }

/* Форма */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(8, 14, 20, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 480px; background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 14px; max-height: 94%; overflow-y: auto; align-content: start;
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 16px; }
.close { border: 0; background: var(--bg); width: 32px; height: 32px; border-radius: 50%; line-height: 0; display: grid; place-items: center; padding: 0; }
.close svg { width: 14px; height: 14px; }
.f { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); min-width: 0; }
input[type="text"], input[type="date"], input[type="time"], input[type="number"] {
  font: inherit; font-size: 16px; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0;
}
/* iOS: поля даты и времени игнорируют ширину, пока не сброшен системный вид */
input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; display: block; max-width: 100%; min-height: 46px; text-align: left; }

          var x = el('button', 'x'); x.type = 'button'; x.innerHTML = IC.x; x.setAttribute('aria-label', 'Удалить подзадачу');
          x.addEventListener('click', function () { t.subs.splice(i, 1); renderAll(); });

        });

      }
      var add = el('div', 'addrow');

      var go = el('button', 'go', '+'); go.type = 'button'; go.setAttribute('aria-label', 'Добавить подзадачу');
      function addSub() { var v = inp.value.trim(); if (!v) return; t.subs.push({ t: v, done: false }); pendingFocus = 'sub-' + t.id; renderAll(); }
      go.addEventListener('click', addSub);

    /* 3. Комментарии */

      }
      var cr = el('div', 'addrow');

      ci.setAttribute('data-focus', 'cm-' + t.id); ci.setAttribute('aria-label', 'Новый комментарий'); ci.autocomplete = 'off';
      var cg = el('button', 'go', '+'); cg.type = 'button'; cg.setAttribute('aria-label', 'Добавить комментарий');
      function addCm() { var v = ci.value.trim(); if (!v) return; t.comments.push({ who: viewer, text: v }); pendingFocus = 'cm-' + t.id; renderAll(); }
      cg.addEventListener('click', addCm);
      ci.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addCm(); } });
      cr.appendChild(ci); cr.appendChild(cg);
      cs.appendChild(cr);
      box.appendChild(cs);
    }

    /* 4. Пустые блоки: компактные кнопки «+ Подзадача» и «+ Комментарий» */
    if (!showSubs && !showCm) {
      var g2 = el('div', 'ghosts');
      g2.appendChild(ghostBtn('Подзадача', openSubs));
      g2.appendChild(ghostBtn('Комментарий', openCm));
      box.appendChild(g2);
    } else if (!showSubs || !showCm) {
      var g1 = el('div', 'ghosts one-col');

      box.appendChild(g1);

  }

  function group(title, sub, items, cls, opts) {
    var g = el('section', 'group' + (cls ? ' ' + cls : ''));
    var h = el('h2', null, title);
    if (sub) h.appendChild(el('span', 'sub', sub));
    g.appendChild(h);

  }

  /* Вкладка «Задачи» */
  var LIST_DAYS = 7;
  function renderList(main) {
    var all = tasks.filter(visible);
    var total = 0, doneN = 0;
    all.forEach(function (t) {
      if (t.rep) {
        if (t.lastDone === todayIso) { total++; doneN++; }
        else if (occursOn(t, todayIso)) total++;
      } else if (t.date === todayIso) { total++; if (t.done) doneN++; }
    });
    var sum = el('div', 'summary');
    var pct = total ? doneN / total : 0, CIR = 2 * Math.PI * 18;
    var ring = el('span', 'ring');
    ring.innerHTML = '<svg viewBox="0 0 44 44" aria-hidden="true"><circle class="rt" cx="22" cy="22" r="18"/><circle class="rf" cx="22" cy="22" r="18" stroke-dasharray="' + (CIR * pct).toFixed(1) + ' ' + CIR.toFixed(1) + '"/></svg>';
    ring.appendChild(el('b', null, total ? Math.round(pct * 100) + '%' : '–'));
    sum.appendChild(ring);
    var st = el('div', 'sum-t');
    st.appendChild(el('b', null, 'Сегодня'));
    st.appendChild(el('span', null, total ? 'Выполнено ' + doneN + ' из ' + total : 'На сегодня задач нет'));
    sum.appendChild(st);
    main.appendChild(sum);
    var inboxN = tasks.filter(function (t) { return visible(t) && !t.date && !t.rep && !t.done; }).length;
    if (inboxN) {
      var bn = el('button', 'banner'); bn.type = 'button';
      var bt = el('span', 'bt');
      bt.appendChild(el('b', null, 'В Backlog: ' + inboxN + ' ' + plural(inboxN, 'задача', 'задачи', 'задач') + ' без даты'));
      bt.appendChild(el('small', null, 'Назначьте день или сделайте, когда будет время'));
      bn.appendChild(bt);
      var bi = el('span'); bi.innerHTML = IC.right; bn.appendChild(bi);
      bn.addEventListener('click', function () { tab = 'inbox'; expanded = null; renderAll(); window.scrollTo(0, 0); });
      main.appendChild(bn);
    }

    var open = all.filter(function (t) { return !t.done; });
    var late = open.filter(function (t) { return t.date && t.date < todayIso; }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : cmp(a, b); });
    if (late.length) main.appendChild(group('Просрочено', '', late, 'late', { showDate: true }));

    /* Только ближайшие 7 дней. Повторяющиеся задачи показываются в каждом дне, куда попадают:
       копии вычисляются из правила повтора и в базу не записываются. */
    var horizon = rel(LIST_DAYS - 1), dates = {}, later = 0;
    function put(d, t) { (dates[d] = dates[d] || []).push(t); }
    open.forEach(function (t) {
      if (!t.date) return;
      if (t.date > horizon) { later++; return; }
      if (t.date >= todayIso) put(t.date, t);
      if (t.rep) {
        for (var i = 0; i < LIST_DAYS; i++) {
          var d = rel(i);
          if (d > t.date && occursOn(t, d)) put(d, t);
        }
      }
    });
    Object.keys(dates).sort().forEach(function (d) {
      var label = d === todayIso ? 'Сегодня' : d === rel(1) ? 'Завтра' : fmtDay(d);
      var sub = (d === todayIso || d === rel(1)) ? fmtDay(d) : '';
      main.appendChild(group(label, sub, dates[d].sort(cmp), d === todayIso ? 'now' : '', { d: d }));
    });
    var hn = el('div', 'horizon');
    var hsd = shortDate(horizon);
    hn.appendChild(el('span', null, 'Показаны задачи на ближайшие ' + LIST_DAYS + ' дней, до ' + hsd + (/\.$/.test(hsd) ? '' : '.') +
      (later ? ' Ещё ' + later + ' ' + plural(later, 'задача', 'задачи', 'задач') + ' позже — смотрите в календаре.' : '')));
    var hb = el('button', 'hz-link', 'Открыть календарь'); hb.type = 'button';
    hb.addEventListener('click', function () { tab = 'cal'; expanded = null; renderAll(); window.scrollTo(0, 0); });
    hn.appendChild(hb);
    main.appendChild(hn);
    var done = all.filter(function (t) { return t.done; });
    if (done.length) main.appendChild(group('Выполнено', 'убираются через ' + DONE_TTL_DAYS + ' дней', done, '', { showDate: false }));

    if (!all.length) {
      var e = el('div', 'empty');
      e.appendChild(el('b', null, 'Здесь пока пусто'));
      e.appendChild(document.createTextNode('Нажмите «Добавить», чтобы поставить первую задачу.'));
      main.appendChild(e);
    }
  }

  /* Вкладка «Календарь» */
  function tasksOn(d) { return tasks.filter(function (t) { return visible(t) && occursOn(t, d); }).sort(cmp); }
  function renderCal(main) {
    var mode = el('div', 'mode');
    [['month', 'Месяц'], ['week', 'Неделя']].forEach(function (p) {
      var b = el('button', null, p[1]); b.type = 'button';
      b.setAttribute('aria-pressed', String(calMode === p[0]));
      b.addEventListener('click', function () { calMode = p[0]; renderAll(); });
      mode.appendChild(b);
    });
    main.appendChild(mode);
    if (calMode === 'week') renderWeek(main); else renderMonth(main);
  }
  function navBtn(icon, label, fn) {
    var b = el('button', 'nav'); b.type = 'button'; b.innerHTML = icon; b.setAttribute('aria-label', label);
    b.addEventListener('click', fn);
    return b;
  }
  function renderMonth(main) {
    var cal = el('div', 'cal');
    var head = el('div', 'cal-head');
    var m = el('div', 'month', view.toLocaleDateString('ru-RU', { month: 'long' }));
    m.appendChild(el('span', null, String(view.getFullYear())));
    head.appendChild(navBtn(IC.left, 'Предыдущий месяц', function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderAll(); }));
    head.appendChild(m);
    head.appendChild(navBtn(IC.right, 'Следующий месяц', function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderAll(); }));
    cal.appendChild(head);

    var grid = el('div', 'grid');
    ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(function (w, i) { grid.appendChild(el('div', 'wd' + (i > 4 ? ' we' : ''), w)); });
    var start = addDays(view, -((view.getDay() + 6) % 7));
    for (var i = 0; i < 42; i++) {
      var d = addDays(start, i);
      if (i >= 35 && d.getMonth() !== view.getMonth()) break;
      var s = iso(d);
      var b = el('button', 'day' + (d.getMonth() !== view.getMonth() ? ' out' : '') + (s === todayIso ? ' today' : '') + (s === selected ? ' sel' : ''));
      b.type = 'button';
      b.appendChild(el('span', 'num', String(d.getDate())));
      var dots = el('span', 'dots');
      var seen = {};
      tasksOn(s).forEach(function (t) {
        if (!t.done && !seen[t.who]) { seen[t.who] = 1; dots.appendChild(el('span', 'dot ' + t.who)); }
      });
      b.appendChild(dots);
      b.setAttribute('aria-label', fmtDay(s));
      (function (sIso, dd) {
        b.addEventListener('click', function () {
          selected = sIso; expanded = null;
          if (dd.getMonth() !== view.getMonth()) view = new Date(dd.getFullYear(), dd.getMonth(), 1);
          renderAll();
        });
      })(s, d);
      grid.appendChild(b);
    }
    cal.appendChild(grid);
    var leg = el('div', 'legend');
    ['him', 'her', 'both'].forEach(function (k) {
      var sp = el('span'); sp.appendChild(el('span', 'dot ' + k)); sp.appendChild(document.createTextNode(NAMES[k])); leg.appendChild(sp);
    });
    cal.appendChild(leg);
    main.appendChild(cal);

    var items = tasksOn(selected);
    if (items.length) main.appendChild(group(fmtDay(selected), '', items, '', { d: selected }));
    else {
      var e = el('div', 'empty');
      e.appendChild(el('b', null, fmtDay(selected)));
      e.appendChild(document.createTextNode('На этот день ничего не запланировано.'));
      main.appendChild(e);
    }
  }
  function renderWeek(main) {
    var end = addDays(weekStart, 6);
    var cal = el('div', 'cal');
    var head = el('div', 'cal-head');
    var fmt = function (d) { return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); };
    head.appendChild(navBtn(IC.left, 'Предыдущая неделя', function () { weekStart = addDays(weekStart, -7); renderAll(); }));
    head.appendChild(el('div', 'month', fmt(weekStart) + ' – ' + fmt(end)));
    head.appendChild(navBtn(IC.right, 'Следующая неделя', function () { weekStart = addDays(weekStart, 7); renderAll(); }));
    cal.appendChild(head);
    var leg = el('div', 'legend');
    ['him', 'her', 'both'].forEach(function (k) {
      var sp = el('span'); sp.appendChild(el('span', 'dot ' + k)); sp.appendChild(document.createTextNode(NAMES[k])); leg.appendChild(sp);
    });
    cal.appendChild(leg);

    for (var i = 0; i < 7; i++) {

      var label = fmtDay(s);
      if (items.length) main.appendChild(group(s === todayIso ? 'Сегодня' : label.split(',')[0], s === todayIso ? label : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }), items, s === todayIso ? 'now' : '', { d: s }));
      else {
        var g = el('section', 'group' + (s === todayIso ? ' now' : ''));
        var h = el('h2', null, s === todayIso ? 'Сегодня' : label.split(',')[0]);
        h.appendChild(el('span', 'sub', d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' })));
        g.appendChild(h);
        g.appendChild(el('div', 'free', 'Свободно'));
        main.appendChild(g);
      }
    }
  }

  /* Вкладка «Списки» */
  function renderLists(main) {
    var card = el('div', 'card');
    lists.forEach(function (L) {
      var n = tasks.filter(function (t) { return t.list === L.id && !t.done; }).length;

      var ch = el('span'); ch.innerHTML = IC.right; ch.firstChild.style.width = '14px'; b.appendChild(ch);
      b.addEventListener('click', function () { listFilter = L.id; tab = 'list'; renderAll(); window.scrollTo(0, 0); });

  /* Вкладка «Привычки» */
  function streak(h, p) {
    var n = 0, d = today;
    if (!h.log[p][iso(d)]) d = addDays(d, -1);
    while (h.log[p][iso(d)]) { n++; d = addDays(d, -1); }
    return n;
  }
  function renderHabits(main) {
    var card = el('div', 'card');
    habits.forEach(function (h) {
      var box = el('div', 'habit');
      box.appendChild(el('h3', null, h.title));
      (h.who === 'both' ? ['him', 'her'] : [h.who]).forEach(function (p) {
        var row = el('div', 'hrow');
        var lab = el('div', 'hl');
        var b = el('b'); b.appendChild(el('span', 'dot ' + p)); b.appendChild(document.createTextNode(NAMES[p])); lab.appendChild(b);
        var n = streak(h, p);
        lab.appendChild(el('small', null, n ? 'серия ' + n + ' дн.' : 'нет серии'));
        row.appendChild(lab);
        var strip = el('div', 'strip');
        for (var i = 6; i >= 0; i--) {
          var d = addIsoDays(todayIso, -i);
          var on = !!h.log[p][d];
          var wd = parseIso(d).toLocaleDateString('ru-RU', { weekday: 'short' });
          var cls = 'hd' + (on ? ' on' : '') + (i === 0 ? ' today' : '') + (p === viewer ? '' : ' ro');
          var c = p === viewer ? el('button', cls, wd) : el('div', cls, wd);
          c.style.setProperty('--c', 'var(--' + p + ')');
          if (p === viewer) {
            c.type = 'button';
            c.setAttribute('aria-pressed', String(on));
            c.setAttribute('aria-label', h.title + ', ' + fmtDay(d));
            (function (dd) { c.addEventListener('click', function () { if (h.log[p][dd]) delete h.log[p][dd]; else h.log[p][dd] = 1; renderAll(); }); })(d);
          }
          strip.appendChild(c);
        }
        row.appendChild(strip);
        box.appendChild(row);
      });
      card.appendChild(box);
    });
    main.appendChild(card);

    var fc = el('div', 'card form-card');
    fc.appendChild(el('h3', null, 'Новая привычка'));
    var inp = el('input'); inp.type = 'text'; inp.id = 'new-habit'; inp.placeholder = 'Например, Йога по утрам'; inp.maxLength = 40; inp.value = newHabitName; inp.autocomplete = 'off';
    inp.setAttribute('aria-label', 'Название привычки');

    fc.appendChild(sg);
    var go = el('button', 'save', 'Создать привычку'); go.type = 'button';
    go.addEventListener('click', function () {
      var v = newHabitName.trim(); if (!v) { inp.focus(); return; }
      habits.push({ id: nextId++, title: v, who: newHabitWho, log: { him: {}, her: {} } });
      newHabitName = '';
      renderAll();
    });
    fc.appendChild(go);
    main.appendChild(fc);
  }

  /* Вкладка «Backlog» */
  function inboxTasks(done) { return tasks.filter(function (t) { return visible(t) && !t.date && !t.rep && !!t.done === done; }); }
  function assignDate(t, d) {
    var oldDate = t.date;
    t.date = d; scheduling = null;
    toast('Назначено: ' + relLabel(d), function () { t.date = oldDate; });
    renderAll();
  }
  function renderInbox(main) {
    main.appendChild(el('p', 'inbox-note', 'Общий список задач без даты. Назначьте задаче день или отметьте её, когда дойдут руки.'));
    var qa = el('div', 'qa');
    var inp = el('input'); inp.type = 'text'; inp.id = 'inbox-add'; inp.maxLength = 140; inp.autocomplete = 'off';
    inp.placeholder = 'Записать задачу, дату можно не ставить'; inp.value = inboxDraft;
    inp.setAttribute('data-focus', 'inbox-add'); inp.setAttribute('aria-label', 'Новая задача в Backlog');
    inp.addEventListener('input', function () { inboxDraft = inp.value; });
    var go = el('button', 'go', '+'); go.type = 'button'; go.setAttribute('aria-label', 'Добавить в Backlog');
    function addInbox() {
      var raw = inp.value.trim(); if (!raw) return;
      var p = parseSmart(raw), r = p.rec;
      var who = r.who || (filter === 'mine' ? viewer : filter === 'theirs' ? other() : 'both');
      var date = r.date || (r.rep ? todayIso : '');
      tasks.push({ id: uid(), title: p.title || raw, who: who, date: date, time: r.time || '', prio: r.prio || 0, list: r.list !== undefined ? r.list : listFilter, rep: r.rep || null, done: false, lastDone: '', subs: [], comments: [], thanks: [] });
      inboxDraft = ''; pendingFocus = 'inbox-add';
      renderAll();
      if (date) toast('Назначено: ' + relLabel(date), null);
    }
    go.addEventListener('click', addInbox);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addInbox(); } });
    qa.appendChild(inp); qa.appendChild(go);
    main.appendChild(qa);

    var open = inboxTasks(false).sort(function (a, b) { return (b.prio - a.prio) || (b.id - a.id); });
    if (open.length) main.appendChild(group('Ждут своего дня', String(open.length), open, '', { inbox: true }));
    else {
      var e = el('div', 'empty');
      e.appendChild(el('b', null, 'Backlog пуст'));
      e.appendChild(document.createTextNode('Записывайте сюда всё, что нужно сделать когда-нибудь.'));
      main.appendChild(e);
    }
    var done = inboxTasks(true);
    if (done.length) main.appendChild(group('Сделано без даты', '', done, '', { inbox: true }));
  }

  var lastExpanded = null;
  function renderAll() {
    if (expanded !== lastExpanded) { subOpen = {}; cmOpen = {}; lastExpanded = expanded; }
    autosync();
    renderHeader();
    var main = document.getElementById('main');
    main.textContent = '';
    if (tab === 'list') renderList(main);
    else if (tab === 'cal') renderCal(main);
    else if (tab === 'inbox') renderInbox(main);
    else if (tab === 'lists') renderLists(main);
    else renderHabits(main);
    if (pendingFocus) {
      var e = document.querySelector('[data-focus="' + pendingFocus + '"]');
      if (e) e.focus();
      pendingFocus = null;
    }
  }

  /* ======================= Supabase: вход, данные, синхронизация ======================= */
  var cfg = window.APP_CONFIG || {};
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {} }
  var sb = null, ready = false, me = null, inviteCode = '', justCreated = false;
  var snap = {}, listSnap = {}, tq = {}, inflight = 0, reloadTimer = null, settingsEl = null;

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  }
  function firstWord(n) { return String(n || '').trim().split(/\s+/)[0] || 'Без имени'; }

  /* Экран-заглушка: загрузка, ошибки, знакомство */
  var gate = document.getElementById('gate');
  function gateCard(title, text, buttons) {
    gate.textContent = '';
    var box = el('div', 'gate-box');
    box.appendChild(el('h2', null, title));
    if (text) box.appendChild(el('p', null, text));
    if (buttons && buttons.length) {
      var bs = el('div', 'gate-btns');
      buttons.forEach(function (b) {
        var x = el('button', 'btn ' + (b.cls || ''), b.t); x.type = 'button';
        x.addEventListener('click', b.fn);
        bs.appendChild(x);
      });
      box.appendChild(bs);
    }
    gate.appendChild(box);
    gate.hidden = false;
  }

  function applyMe() {
    viewer = me.slot;
    var o = me.slot === 'him' ? 'her' : 'him';
    NAMES[me.slot] = firstWord(me.name);
    NAMES[o] = me.partner ? firstWord(me.partner.name) : 'Партнёр';
  }

  async function boot() {
    gateCard('Наши дела', 'Загрузка…', []);
    if (!tg || !tg.initData) {
      gateCard('Откройте через Telegram', 'Это Telegram Mini App. Найдите своего бота в Telegram и нажмите кнопку «Открыть «Наши дела»».', []);
      return;
    }
    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || /ВСТАВЬТЕ/.test(cfg.SUPABASE_URL + cfg.SUPABASE_ANON_KEY)) {
      gateCard('Не настроено', 'Заполните файл config.js: адрес проекта Supabase, ключ anon и имя бота.', []);
      return;
    }
    try {
      sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false } });
      var r = await fetch(cfg.SUPABASE_URL + '/functions/v1/tg-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: cfg.SUPABASE_ANON_KEY },
        body: JSON.stringify({ initData: tg.initData })
      });
      if (!r.ok) throw new Error('auth ' + r.status);
      var sess = await r.json();
      var st = await sb.auth.setSession({ access_token: sess.access_token, refresh_token: sess.refresh_token });
      if (st.error) throw st.error;
      inviteCode = new URLSearchParams(location.search).get('code') || sess.start_param || '';
      await loadMe();
    } catch (e) {
      console.error(e);
      gateCard('Не удалось войти', 'Проверьте интернет и попробуйте ещё раз.', [{ t: 'Повторить', fn: boot }]);
    }
  }

  async function loadMe() {
    var r = await sb.rpc('me');
    if (r.error) throw r.error;
    me = r.data;
    if (!me) { onboarding(); return; }
    applyMe();
    await loadAll();
    startRealtime();
    ready = true;
    gate.hidden = true;
    renderAll();
    if (justCreated) { justCreated = false; openSettings(); }
  }

  function onboarding() {
    if (inviteCode) {
      gateCard('Вас пригласили', 'Присоединитесь к общему списку дел, и задачи будут у вас на двоих.', [
        { t: 'Присоединиться', fn: joinCouple }
      ]);
      return;
    }
    gateCard('Наши дела', 'Общие задачи для двоих. Выберите свой цвет, а потом отправьте приглашение партнёру.', [
      { t: 'Я синий', cls: 'him', fn: function () { createCouple('him'); } },
      { t: 'Я розовый', cls: 'her', fn: function () { createCouple('her'); } }
    ]);
  }
  async function createCouple(slot) {
    var r = await sb.rpc('create_couple', { p_slot: slot });
    if (r.error) { gateCard('Не получилось', 'Не удалось создать пару. Попробуйте ещё раз.', [{ t: 'Назад', fn: onboarding }]); return; }
    justCreated = true;
    await loadMe();
  }
  async function joinCouple() {
    var r = await sb.rpc('join_couple', { p_code: inviteCode });
    if (r.error) {
      gateCard('Не получилось присоединиться', 'Ссылка недействительна или в паре уже двое. Попросите партнёра прислать новую.', []);
      return;
    }
    await loadMe();
  }

  /* Загрузка данных */
  function rowToTask(row, comms) {
    return {
      id: row.id, title: row.title, who: row.who,
      date: row.due_date || '', time: row.due_time ? row.due_time.slice(0, 5) : '',
      prio: row.prio, list: row.list_id || '',
      rep: row.rep_unit ? { unit: row.rep_unit, every: row.rep_every } : null,
      done: row.done, doneAt: row.done_at || '', lastDone: row.last_done || '',
      subs: row.subs || [], comments: comms || [], thanks: row.thanks || []
    };
  }
  function taskPayload(t) {
    return {
      title: t.title, who: t.who, due_date: t.date || null, due_time: t.time || null, prio: t.prio,
      list_id: t.list || null, rep_unit: t.rep ? t.rep.unit : null, rep_every: t.rep ? t.rep.every : 1,
      done: !!t.done, last_done: t.lastDone || null, subs: t.subs, thanks: t.thanks
    };
  }
  async function loadAll() {
    var res = await Promise.all([
      sb.from('lists').select('*').order('created_at'),
      sb.from('tasks').select('*').order('created_at'),
      sb.from('comments').select('*').order('created_at')
    ]);
    res.forEach(function (r) { if (r.error) throw r.error; });
    var slotOf = {}; slotOf[me.member_id] = me.slot;
    if (me.partner) slotOf[me.partner.id] = me.partner.slot;
    var byTask = {};
    res[2].data.forEach(function (c) { (byTask[c.task_id] = byTask[c.task_id] || []).push({ id: c.id, who: slotOf[c.author_id] || 'him', text: c.text }); });
    lists = res[0].data.map(function (l) { return { id: l.id, name: l.name, color: l.color }; });
    tasks = res[1].data.map(function (r) { return rowToTask(r, byTask[r.id]); });
    snap = {}; listSnap = {};
    tasks.forEach(function (t) { snap[t.id] = JSON.stringify(taskPayload(t)); });
    lists.forEach(function (l) { listSnap[l.id] = 1; });
  }

  /* Запись: сравниваем состояние с последним сохранённым и отправляем разницу */
  function chain(id, fn) {
    inflight++;
    tq[id] = (tq[id] || Promise.resolve()).then(fn).then(
      function (r) { if (r && r.error) writeFailed(r.error); },
      function (e) { writeFailed(e); }
    ).then(function () { inflight--; });
  }
  function writeFailed(e) {
    console.error(e);
    toast('Не удалось сохранить. Обновляю данные…', null);
    scheduleReload(1500);
  }
  function pushComments(t) {
    t.comments.forEach(function (c) {
      if (c.id || c.sending || c.who !== viewer) return;
      c.sending = true;
      chain(t.id, function () {
        return sb.from('comments').insert({ task_id: t.id, text: c.text }).select('id').single().then(function (r) {
          c.sending = false;
          if (r.data) c.id = r.data.id;
          return r;
        });
      });
    });
  }
  function autosync() {
    if (!ready) return;
    var seen = {};
    tasks.forEach(function (t) {
      seen[t.id] = 1;
      var p = taskPayload(t), js = JSON.stringify(p);
      if (!(t.id in snap)) {
        snap[t.id] = js;
        if (t.comments.some(function (c) { return c.id; })) {
          t.comments = t.comments.filter(function (c) { return c.who === viewer; });
          t.comments.forEach(function (c) { delete c.id; });
        }
        chain(t.id, function () { return sb.from('tasks').insert(Object.assign({ id: t.id }, p)); });
      } else if (snap[t.id] !== js) {
        snap[t.id] = js;
        chain(t.id, function () { return sb.from('tasks').update(p).eq('id', t.id); });
      }
      pushComments(t);
    });
    Object.keys(snap).forEach(function (id) {
      if (!seen[id]) { delete snap[id]; chain(id, function () { return sb.from('tasks').delete().eq('id', id); }); }
    });
    lists.forEach(function (L) {
      if (!(L.id in listSnap)) {
        listSnap[L.id] = 1;
        chain('list:' + L.id, function () { return sb.from('lists').insert({ id: L.id, name: L.name, color: L.color }); });
      }
    });
  }

  /* Реальное время: если партнёр что-то изменил, подтягиваем свежие данные */
  function scheduleReload(ms) {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(reload, typeof ms === 'number' ? ms : 400);
  }
  async function reload() {
    if (!ready) return;
    if (inflight > 0) { scheduleReload(600); return; }
    var a = document.activeElement;
    if ((a && a.tagName === 'INPUT' && a.value) || !scrim.hidden || settingsEl) { scheduleReload(2500); return; }
    try { await loadAll(); renderAll(); } catch (e) { console.error(e); }
  }
  function startRealtime() {
    var ch = sb.channel('nashi-dela');
    ['tasks', 'comments', 'lists'].forEach(function (tb) {
      ch.on('postgres_changes', { event: '*', schema: 'public', table: tb }, function () { scheduleReload(); });
    });
    ch.on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, async function () {
      var r = await sb.rpc('me');
      if (r.data) { me = r.data; applyMe(); renderAll(); if (settingsEl) openSettings(); }
    });
    ch.subscribe();
  }

  /* Настройки: приглашение партнёра и время утренней сводки */
  function closeSettings() { if (settingsEl) { settingsEl.remove(); settingsEl = null; } }
  function openSettings() {
    if (!me) return;
    closeSettings();
    var link = 'https://t.me/' + cfg.BOT_USERNAME + '?start=' + me.invite_code;
    var wrap = el('div', 'scrim');
    var sheet = el('div', 'sheet');
    var head = el('div', 'sheet-head');
    head.appendChild(el('h3', null, 'Настройки'));
    var cl = el('button', 'close'); cl.type = 'button'; cl.innerHTML = IC.x; cl.setAttribute('aria-label', 'Закрыть');
    cl.addEventListener('click', closeSettings);
    head.appendChild(cl); sheet.appendChild(head);

    var who = el('div', 'f');
    var l1 = el('div', 'who-line'); l1.appendChild(el('span', 'dot ' + me.slot)); l1.appendChild(document.createTextNode('Вы: ' + NAMES[me.slot]));
    var l2 = el('div', 'who-line');
    if (me.partner) { l2.appendChild(el('span', 'dot ' + me.partner.slot)); l2.appendChild(document.createTextNode('Партнёр: ' + NAMES[me.partner.slot])); }
    else l2.appendChild(document.createTextNode('Партнёр пока не присоединился'));
    who.appendChild(l1); who.appendChild(l2); sheet.appendChild(who);

    if (!me.partner) {
      var inv = el('div', 'f');
      inv.appendChild(el('span', null, 'Отправьте эту ссылку партнёру'));
      inv.appendChild(el('div', 'linkbox', link));
      var row = el('div', 'row2');
      var send = el('button', 'btn', 'Отправить'); send.type = 'button';
      send.addEventListener('click', function () {
        var u = 'https://t.me/share/url?url=' + encodeURIComponent(link) + '&text=' + encodeURIComponent('Присоединяйся к нашему списку дел');
        if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u, '_blank');
      });
      var copy = el('button', 'btn sec', 'Скопировать'); copy.type = 'button';
      copy.addEventListener('click', function () {
        try { navigator.clipboard.writeText(link).then(function () { toast('Ссылка скопирована', null); }); } catch (e) { toast('Выделите ссылку и скопируйте вручную', null); }
      });
      row.appendChild(send); row.appendChild(copy);
      inv.appendChild(row); sheet.appendChild(inv);
    }

    if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && typeof tg.addToHomeScreen === 'function') {
      var hs = el('div', 'f');
      hs.style.display = 'none';
      var hb = el('button', 'btn sec', 'Добавить на главный экран'); hb.type = 'button';
      hb.addEventListener('click', function () { try { tg.addToHomeScreen(); } catch (e) {} });
      hs.appendChild(hb);
      sheet.appendChild(hs);
      try {
        tg.checkHomeScreenStatus(function (st) { if (st === 'missed' || st === 'unknown') hs.style.display = ''; });
      } catch (e) {}
    }

    var mt = el('div', 'f');
    var lab = el('label', null, 'Утренняя сводка в Telegram'); lab.setAttribute('for', 's-morning');
    var inp = el('input'); inp.type = 'time'; inp.id = 's-morning'; inp.value = String(me.morning_time || '08:00').slice(0, 5);
    inp.addEventListener('change', function () {
      if (!inp.value) return;
      sb.from('couples').update({ morning_time: inp.value }).eq('id', me.couple_id).then(function (r) {
        if (r.error) { toast('Не удалось сохранить время', null); return; }
        me.morning_time = inp.value; toast('Время сводки сохранено', null);
      });
    });
    mt.appendChild(lab); mt.appendChild(inp);
    mt.appendChild(el('span', null, 'Часовой пояс: ' + (me.tz || 'Europe/Minsk')));
    sheet.appendChild(mt);

    wrap.appendChild(sheet);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) closeSettings(); });
    document.body.appendChild(wrap);
    settingsEl = wrap;
  }

  document.getElementById('viewer').addEventListener('click', function () { openSettings(); });
  document.getElementById('theme').addEventListener('click', function () {
    var next = effectiveDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('dela-theme', next); } catch (e) {}
    renderTheme();
  });

  /* Форма задачи. Все параметры показаны сразу под названием; пока вводится текст, нижнюю часть
     закрывает клавиатура. «Готово» на клавиатуре или прокрутка параметров её убирают. */
  var scrim = document.getElementById('scrim');
  var fTitle = document.getElementById('f-title');
  var fBody = document.getElementById('f-body');
  var fSave = document.getElementById('save');
  var form = null, base = null, fCalOpen = false, fCal = [0, 0], fIgnore = [], fSpans = [], fIgnSpans = [], fSubFocus = false;
  var fHl = document.getElementById('f-hl');
  var FKEYS = ['date', 'time', 'who', 'prio', 'list', 'rep'];
  function seg(box, opts, val, pick) {
    box.textContent = '';
    box.style.setProperty('--n', opts.length);
    opts.forEach(function (o) {
      var b = el('button'); b.type = 'button';
      b.style.setProperty('--c', o.c || 'var(--accent)');
      b.setAttribute('aria-pressed', String(val === o.k));
      if (o.dot) b.appendChild(el('span', 'dot ' + o.dot));
      if (o.ic) { var s = el('span', 'nf-pic'); s.innerHTML = o.ic; s.style.color = o.c; b.appendChild(s); }
      b.appendChild(document.createTextNode(o.t));
      b.addEventListener('click', function () { pick(o.k); });
      box.appendChild(b);
    });
  }

  /* По умолчанию задача на того, кто её добавляет. Фильтры «Партнёр» и «Общие» подставляют своё. */
  function blankForm() {
    var who = filter === 'theirs' ? other() : filter === 'both' ? 'both' : viewer;
    return { id: null, who: who, date: tab === 'cal' ? selected : tab === 'inbox' ? '' : todayIso, time: '', prio: 0, list: listFilter, rep: null, subs: [] };
  }
  function formCtx() {
    if (form.id) return '';
    var a = [];
    if (tab === 'cal') a.push('Из календаря: ' + relLabel(selected));
    if (tab === 'inbox') a.push('Из Backlog: без даты');
    if (listFilter && listById(listFilter)) a.push('Список «' + listById(listFilter).name + '»');
    return a.join(' · ');
  }
  function setF(k, v) { form[k] = v; base[k] = v; }
  function whenText() {
    var s = form.date ? relLabel(form.date) : (form.rep ? 'с сегодня' : 'Backlog');
    s = s.charAt(0).toUpperCase() + s.slice(1);
    if (form.time) s += ', ' + form.time;
    if (form.rep) s += ' · ' + repLabel(form.rep);
    return s;
  }
  function pill(label, on, fn, icon) {
    var b = el('button', 'pill' + (on ? ' on' : '')); b.type = 'button';
    if (icon) b.innerHTML = icon;
    if (label) b.appendChild(document.createTextNode(label));
    b.addEventListener('click', fn);
    return b;
  }
  function syncCal() { var d = form.date ? parseIso(form.date) : today; fCal = [d.getFullYear(), d.getMonth()]; }
  /* Ручной выбор важнее слова в названии: слово, которое задавало это поле, убирается из текста */
  function releaseToken(k) {
    var v = fTitle.value, pr = parseSmart(v, fIgnore);
    if (!(k in pr.rec)) return;
    for (var i = 0; i < pr.spans.length; i++) {
      var sp = pr.spans[i], w = v.slice(sp[0], sp[1]).toLowerCase();
      if (!(k in parseSmart(v, fIgnore.concat([w])).rec)) {
        fTitle.value = (v.slice(0, sp[0]) + v.slice(sp[1])).replace(/\s{2,}/g, ' ').replace(/^\s+/, '');
        return;
      }
    }
  }
  /* то же, что pick, но без перерисовки формы — пока открыт системный выбор даты/времени */
  function pickLive(k, v) {
    releaseToken(k); setF(k, v);
    var pr = parseSmart(fTitle.value, fIgnore);
    fSpans = pr.spans; fIgnSpans = ignoredSpans(fTitle.value);
    renderHl(); renderSum();
  }
  function pick(k, v, also) {
    (also || []).concat([k]).forEach(releaseToken);
    setF(k, v);
    var pr = parseSmart(fTitle.value, fIgnore);
    fSpans = pr.spans; fIgnSpans = ignoredSpans(fTitle.value);
    FKEYS.forEach(function (x) { form[x] = (x in pr.rec) ? pr.rec[x] : base[x]; });
    renderHl(); renderForm();
  }
  function section(title, node) {
    var w = el('div', 'nf-sec');
    w.appendChild(el('div', 'nf-lbl', title));
    w.appendChild(node);
    fBody.appendChild(w);
    return w;
  }

  function calBox() {
    var y = fCal[0], m = fCal[1], box = el('div', 'nf-calbox');
    var h = el('div', 'nf-calh');
    var pv = el('button'); pv.type = 'button'; pv.innerHTML = IC.left; pv.setAttribute('aria-label', 'Предыдущий месяц');
    pv.disabled = y === today.getFullYear() && m === today.getMonth();
    pv.addEventListener('click', function () { var d = new Date(y, m - 1, 1); fCal = [d.getFullYear(), d.getMonth()]; renderForm(); });
    var nx = el('button'); nx.type = 'button'; nx.innerHTML = IC.right; nx.setAttribute('aria-label', 'Следующий месяц');
    nx.addEventListener('click', function () { var d = new Date(y, m + 1, 1); fCal = [d.getFullYear(), d.getMonth()]; renderForm(); });
    var t = new Date(y, m, 1).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }).replace(' г.', '');
    h.appendChild(pv); h.appendChild(el('span', null, t.charAt(0).toUpperCase() + t.slice(1))); h.appendChild(nx);
    box.appendChild(h);
    var g = el('div', 'nf-cal');
    ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(function (w) { g.appendChild(el('span', 'wd', w)); });
    var lead = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
    for (var i = 0; i < lead; i++) g.appendChild(el('span'));
    for (var d = 1; d <= n; d++) (function (d) {
      var ds = iso(new Date(y, m, d));
      var b = el('button', (ds === todayIso ? 'td ' : '') + (ds === form.date ? 'sel' : ''), String(d)); b.type = 'button';
      if (ds < todayIso) b.disabled = true;
      b.addEventListener('click', function () { fCalOpen = false; pick('date', ds); });
      g.appendChild(b);
    })(d);
    box.appendChild(g);
    return box;
  }
  function renderSum() {
    var ctx = document.getElementById('f-ctx'), ct = formCtx();
    ctx.hidden = !ct; ctx.textContent = ct;
    var sum = [NAMES[form.who], whenText()];
    if (form.prio) sum.push(PRIO_NAMES[form.prio]);
    var L = form.list ? listById(form.list) : null;
    if (L) sum.push(L.name);
    if (form.subs.length) sum.push('подзадач: ' + form.subs.length);
    document.getElementById('f-sum').textContent = sum.join(' · ');
    fSave.disabled = !fTitle.value.trim();
  }
  function renderForm() {
    renderSum();
    var st = fBody.scrollTop;
    fBody.textContent = '';

    /* 1. Кто */
    var w = el('div', 'seg');
    seg(w, [{ k: 'him', t: NAMES.him, c: 'var(--him)', dot: 'him' }, { k: 'her', t: NAMES.her, c: 'var(--her)', dot: 'her' }, { k: 'both', t: NAMES.both, c: 'var(--both)', dot: 'both' }], form.who, function (k) { pick('who', k); });
    section('Кто', w);

    /* 2. Когда */
    var dr = el('div', 'nf-row');
    var qd = [['Сегодня', todayIso], ['Завтра', addIsoDays(todayIso, 1)], ['Выходные', nextWd(6, false)]];
    qd.forEach(function (q) { dr.appendChild(pill(q[0], form.date === q[1], function () { fCalOpen = false; pick('date', q[1]); })); });
    dr.appendChild(pill('Backlog', !form.date && !form.rep, function () { fCalOpen = false; setF('time', ''); setF('rep', null); pick('date', '', ['time', 'rep']); }));
    var odate = form.date && qd.every(function (q) { return q[1] !== form.date; });
    /* Другая дата — системный календарь телефона: кнопка с прозрачным полем даты поверх.
       Пока календарь открыт, форму не перерисовываем (иначе iOS его закрывает), обновляем только сводку. */
    var cb = el('label', 'pill nf-tpick' + (odate ? ' on' : ''));
    cb.innerHTML = IC.cal0;
    var cl = el('span', null, odate ? relLabel(form.date) : 'Календарь'); cb.appendChild(cl);
    var di = el('input'); di.type = 'date'; di.min = todayIso; di.value = form.date || ''; di.setAttribute('aria-label', 'Выбрать дату в календаре');
    function liveDate() {
      if (!di.value || di.value < todayIso) return;
      pickLive('date', di.value); cl.textContent = relLabel(di.value);
      var known = qd.some(function (q) { return q[1] === di.value; });
      cb.classList.toggle('on', !known);
    }
    if (!/iPad|iPhone|iPod/.test(navigator.userAgent)) di.addEventListener('click', function () { try { if (di.showPicker) di.showPicker(); } catch (e) {} });
    di.addEventListener('input', liveDate);
    di.addEventListener('change', liveDate);
    di.addEventListener('blur', function () { renderForm(); });
    cb.appendChild(di);
    dr.appendChild(cb);
    var ws = section('Когда', dr);

    /* 3. Время */
    var tr = el('div', 'nf-row');
    var TQ = ['09:00', '13:00', '18:00', '21:00'];
    tr.appendChild(pill('Без времени', !form.time, function () { pick('time', ''); }));
    TQ.forEach(function (q) { tr.appendChild(pill(q, form.time === q, function () { if (!form.date) setF('date', todayIso); pick('time', q); })); });
    /* Своё время: кнопка с прозрачным системным полем поверх. Пока колесо открыто, форму не перерисовываем. */
    var custom = form.time && TQ.indexOf(form.time) < 0;
    var tp = el('label', 'pill nf-tpick' + (custom ? ' on' : ''));
    tp.innerHTML = IC.clock;
    var tl = el('span', null, custom ? form.time : 'Другое'); tp.appendChild(tl);
    var ti = el('input'); ti.type = 'time'; ti.value = form.time || ''; ti.setAttribute('aria-label', 'Другое время');
    function liveTime() {
      if (!ti.value) return;
      if (!form.date) setF('date', todayIso);
      pickLive('time', ti.value); tl.textContent = ti.value; tp.classList.add('on');
    }
    if (!/iPad|iPhone|iPod/.test(navigator.userAgent)) ti.addEventListener('click', function () { try { if (ti.showPicker) ti.showPicker(); } catch (e) {} });
    ti.addEventListener('input', liveTime);
    ti.addEventListener('change', liveTime);
    ti.addEventListener('blur', function () { renderForm(); });
    tp.appendChild(ti); tr.appendChild(tp);
    section('Время', tr);

    /* 4. Повтор — рядом со временем */
    var rr = el('div', 'nf-row');
    [['Нет', ''], ['Каждый день', 'day'], ['Каждую неделю', 'week'], ['Каждый месяц', 'month']].forEach(function (q) {
      rr.appendChild(pill(q[0], (form.rep ? form.rep.unit : '') === q[1], function () {
        if (q[1] && !form.date) setF('date', todayIso);
        pick('rep', q[1] ? { unit: q[1], every: form.rep ? form.rep.every : 1 } : null);
      }));
    });
    var rs = section('Повтор', rr);
    if (form.rep) {
      var ev = el('div', 'nf-row nf-every');
      ev.appendChild(el('span', null, 'Каждые'));
      var n = el('input'); n.type = 'number'; n.min = 1; n.max = 99; n.value = form.rep.every; n.inputMode = 'numeric';
      n.addEventListener('change', function () { setF('rep', { unit: form.rep.unit, every: Math.max(1, Math.min(99, parseInt(n.value, 10) || 1)) }); renderForm(); });
      ev.appendChild(n);
      ev.appendChild(el('span', null, form.rep.unit === 'day' ? 'дн.' : form.rep.unit === 'week' ? 'нед.' : 'мес.'));
      rs.appendChild(ev);
    }

    /* 5. Важность */
    var pg = el('div', 'seg');
    seg(pg, PRIO_NAMES.map(function (n, i) { return { k: i, t: n, c: ['var(--muted)', 'var(--p1)', 'var(--p2)', 'var(--p3)'][i], ic: i ? IC.flag : '' }; }), form.prio, function (k) { pick('prio', k); });
    section('Важность', pg);

    /* 6. Список */
    var pl = el('div', 'picks');
    [{ id: '', name: 'Без списка', color: 'var(--muted)' }].concat(lists).forEach(function (L) {
      var b = el('button', 'pick'); b.type = 'button';
      b.style.setProperty('--c', L.color);
      b.setAttribute('aria-pressed', String(form.list === L.id));
      if (L.id) { var sw = el('span', 'sw'); sw.style.background = L.color; b.appendChild(sw); }
      b.appendChild(document.createTextNode(L.name));
      b.addEventListener('click', function () { pick('list', L.id); });
      pl.appendChild(b);
    });
    section('Список', pl);

    /* 7. Подзадачи */
    var sb = el('div', 'nf-subs');
    form.subs.forEach(function (s, i) {
      var r = el('div', 'nf-sub'); r.appendChild(el('span', null, '— ' + s.t));
      var x = el('button'); x.type = 'button'; x.innerHTML = IC.x; x.setAttribute('aria-label', 'Убрать подзадачу');
      x.addEventListener('click', function () { form.subs.splice(i, 1); renderForm(); });
      r.appendChild(x); sb.appendChild(r);
    });
    var ar = el('div', 'addrow');
    var si = el('input', 'mini'); si.type = 'text'; si.id = 'f-subinput'; si.maxLength = 80; si.placeholder = 'Добавить подзадачу'; si.autocomplete = 'off';
    si.setAttribute('aria-label', 'Новая подзадача'); si.setAttribute('enterkeyhint', 'next');
    var sg = el('button', 'go', '+'); sg.type = 'button'; sg.setAttribute('aria-label', 'Добавить подзадачу');
    function addSub() { var v = si.value.trim(); if (!v) return; form.subs.push({ t: v, done: false }); fSubFocus = true; renderForm(); }
    sg.addEventListener('click', addSub);
    si.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addSub(); } });
    /* поле внизу: при вводе прокручиваем его наверх, чтобы клавиатура не закрыла */
    si.addEventListener('focus', function () { setTimeout(keepFocusedVisible, 350); });
    ar.appendChild(si); ar.appendChild(sg); sb.appendChild(ar);
    section('Подзадачи', sb);

    fBody.scrollTop = st;
    if (fSubFocus) { fSubFocus = false; si.focus(); }
  }
  function renderHl() {
    var v = fTitle.value, marks = [];
    fSpans.forEach(function (sp) { marks.push([sp[0], sp[1], 'mark']); });
    fIgnSpans.forEach(function (sp) { marks.push([sp[0], sp[1], 'ign']); });
    marks.sort(function (a, b) { return a[0] - b[0]; });
    fHl.textContent = '';
    var pos = 0;
    marks.forEach(function (mk2) {
      if (mk2[0] < pos) return;
      if (mk2[0] > pos) fHl.appendChild(document.createTextNode(v.slice(pos, mk2[0])));
      var e2 = mk2[2] === 'mark' ? el('mark', null, v.slice(mk2[0], mk2[1])) : el('span', 'ign', v.slice(mk2[0], mk2[1]));
      fHl.appendChild(e2); pos = mk2[1];
    });
    fHl.appendChild(document.createTextNode(v.slice(pos) + ' '));
    fTitle.style.height = 'auto'; fTitle.style.height = fTitle.scrollHeight + 'px';
  }
  function ignoredSpans(v) {
    var out = [];
    fIgnore.forEach(function (w) {
      var re = new RegExp('(^|\\s)(' + escRe(w) + ')(?=\\s|$|[,;])', 'giu'), r;
      while ((r = re.exec(v))) { var st = r.index + r[1].length; out.push([st, st + r[2].length]); if (re.lastIndex === r.index) re.lastIndex++; }
    });
    return out;
  }
  function onTitleInput() {
    var v = fTitle.value;
    fIgnore = fIgnore.filter(function (w) { return new RegExp('(^|\\s)(' + escRe(w) + ')(?=\\s|$|[,;])', 'iu').test(v); });
    var pr = parseSmart(v, fIgnore);
    fSpans = pr.spans; fIgnSpans = ignoredSpans(v);
    var changed = FKEYS.some(function (k) { var nv = (k in pr.rec) ? pr.rec[k] : base[k]; return JSON.stringify(nv) !== JSON.stringify(form[k]); });
    FKEYS.forEach(function (k) { form[k] = (k in pr.rec) ? pr.rec[k] : base[k]; });
    renderHl();
    if (changed) renderForm(); else renderSum();
  }
  /* Нажатие на выделенное слово выключает его, повторное — включает обратно */
  function onTitleTap() {
    var pos = fTitle.selectionStart;
    if (pos == null || fTitle.selectionEnd !== pos) return;
    var v = fTitle.value;
    var hit = fSpans.filter(function (sp) { return pos > sp[0] && pos < sp[1]; })[0];
    if (hit) { fIgnore.push(v.slice(hit[0], hit[1]).toLowerCase()); onTitleInput(); return; }
    var ig = fIgnSpans.filter(function (sp) { return pos > sp[0] && pos < sp[1]; })[0];
    if (ig) { var w = v.slice(ig[0], ig[1]).toLowerCase(); fIgnore = fIgnore.filter(function (x) { return x !== w; }); onTitleInput(); }
  }
  function openSheet(t) {
    if (t) {
      form = { id: t.id, who: t.who, date: t.date, time: t.time, prio: t.prio, list: t.list, rep: t.rep ? { unit: t.rep.unit, every: t.rep.every } : null, subs: t.subs.map(function (s) { return { t: s.t, done: s.done }; }) };
      fTitle.value = t.title;
    } else {
      form = blankForm();
      fTitle.value = '';
    }
    base = JSON.parse(JSON.stringify(form));
    fCalOpen = false; fSubFocus = false;
    document.getElementById('f-head').textContent = t ? 'Изменить задачу' : 'Новая задача';
    fSave.textContent = t ? 'Сохранить' : 'Добавить';
    fIgnore = []; fSpans = []; fIgnSpans = [];
    renderForm();
    fBody.scrollTop = 0;
    scrim.hidden = false;
    fitScrim();
    renderHl();
    /* iOS открывает клавиатуру только если фокус ставится прямо во время нажатия, без задержки */
    fTitle.focus();
    setTimeout(function () { if (!document.activeElement || document.activeElement === document.body) fTitle.focus(); }, 60);
  }
  function closeSheet() { scrim.hidden = true; scrim.style.top = scrim.style.height = scrim.style.bottom = ''; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
  /* Форма занимает ровно видимую часть экрана над клавиатурой. iOS при открытии клавиатуры
     прокручивает страницу; подгоняем форму под видимую область, чтобы поле ввода не уезжало. */
  function fitScrim() {
    var vv = window.visualViewport;
    if (scrim.hidden || !vv) return;
    scrim.style.top = vv.offsetTop + 'px';
    scrim.style.height = vv.height + 'px';
    scrim.style.bottom = 'auto';
    keepFocusedVisible();
  }
  function keepFocusedVisible() {
    var a = document.activeElement;
    if (scrim.hidden || !a || !fBody.contains(a)) return;
    var br = fBody.getBoundingClientRect(), ar = a.getBoundingClientRect();
    if (ar.bottom > br.bottom - 12) fBody.scrollTop += ar.bottom - br.bottom + 24;
    else if (ar.top < br.top + 8) fBody.scrollTop -= br.top - ar.top + 16;
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitScrim);
    window.visualViewport.addEventListener('scroll', fitScrim);
  }

  document.getElementById('add').addEventListener('click', function () { openSheet(null); });
  document.getElementById('close').addEventListener('click', closeSheet);
  fSave.addEventListener('click', saveForm);
  scrim.addEventListener('click', function (e) { if (e.target === scrim) closeSheet(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !scrim.hidden) closeSheet(); });
  fTitle.addEventListener('input', onTitleInput);
  fTitle.addEventListener('click', onTitleTap);
  /* «Готово»/Enter на клавиатуре прячет её и открывает параметры; Ctrl/Cmd+Enter сразу сохраняет */
  fTitle.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) saveForm(); else fTitle.blur();
  });
  /* прокрутка параметров тоже убирает клавиатуру */
  fBody.addEventListener('touchmove', function () {
    var a = document.activeElement;
    if (a === fTitle) fTitle.blur();
  }, { passive: true });

  /* Сохранение не зависит от отправки формы: в некоторых встроенных браузерах она запрещена */
  document.getElementById('form').addEventListener('submit', function (e) { e.preventDefault(); saveForm(); });
  function saveForm() {
    var raw = fTitle.value.trim();
    if (!raw) { fTitle.focus(); return; }
    var pr = parseSmart(raw, fIgnore);
    var title = pr.title || raw;
    var date = form.date || (form.rep ? todayIso : '');
    var wasEdit = !!form.id;
    if (wasEdit) {
      var t = findTask(form.id);
      t.title = title; t.who = form.who; t.date = date; t.time = form.time; t.prio = form.prio; t.list = form.list; t.rep = form.rep; t.subs = form.subs;
    } else {
      tasks.push({ id: uid(), title: title, who: form.who, date: date, time: form.time, prio: form.prio, list: form.list, rep: form.rep, done: false, lastDone: '', subs: form.subs, comments: [], thanks: [] });
    }
    if (date) { selected = date; var dd = parseIso(date); view = new Date(dd.getFullYear(), dd.getMonth(), 1); }
    closeSheet();
    renderAll();
    toast(wasEdit ? 'Изменения сохранены' : 'Задача добавлена', null);
  }

  boot();
})();
</script>

</body></html>
